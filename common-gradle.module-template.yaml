dependencies: 
  - dev.gradleplugins:gradle-api:8.3: compile-only

settings:
  kotlin:
    freeCompilerArgs:
      # not supported by IDE yet
      #      - -Xcompiler-plugin=tools/gradle-plugins/core/kotlin-sam-with-receiver-compiler-plugin.jar=annotation=org.gradle.api.HasImplicitReceiver
      - -Xplugin=tools/gradle-plugins/core/kotlin-sam-with-receiver-compiler-plugin.jar
      - -P
      - plugin:org.jetbrains.kotlin.samWithReceiver:annotation=org.gradle.api.HasImplicitReceiver
      - -Xplugin=tools/gradle-plugins/core/kotlin-assignment-compiler-plugin.jar
      - -P
      - plugin:org.jetbrains.kotlin.assignment:annotation=org.gradle.api.SupportsKotlinAssignmentOverloading
